<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TradeReady · Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0f11">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one centred card on a dark ground. */
:root{--bg:#0f0f11;--surface:#18181b;--line:#2a2a2f;--ink:#f2f2f2;--muted:#9a9aa2;--lime:#c6ff3d;--red:#ff5c5c;
  --f-ui:Inter,system-ui,sans-serif;--f-head:"Space Grotesk",Inter,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui)}
body{min-height:100vh;display:grid;place-items:center;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:24px}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:700;font-size:20px;letter-spacing:-.03em}
.brand b{color:var(--lime)}
.mark{width:34px;height:34px;border-radius:10px;background:#151517;box-shadow:inset 0 0 0 1px #2c2c31;display:grid;place-items:center;color:var(--lime)}
.mark svg{width:24px;height:24px}
h1{margin:6px 0 0;font-family:var(--f-head);font-size:24px;letter-spacing:-.03em}
p{margin:0;color:var(--muted);font-size:13.5px}
label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#111113;color:var(--ink)}
input:focus{outline:2px solid var(--lime);outline-offset:0}
button{font:inherit;font-weight:700;font-size:15px;padding:13px;border-radius:12px;border:0;background:var(--lime);color:#111;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--red);font-size:13px;min-height:1em}
a{color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<form id="f">
  <div class="brand"><span class="mark"><svg viewBox="8 8 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 30h26M12 43h26" stroke-width="3" stroke-dasharray="1 6" opacity=".5"/><polyline points="12,38 18,33 24,40 30,34 36,39 42,30 51,17" stroke-width="5"/><polyline points="43,16 51,16 51,24" stroke-width="5"/></svg></span><span>Trade<b>Ready</b></span></div>
  <h1>Admin sign in</h1>
  <p>Admin can change the watchlist, start scans and see who signed in.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <div class="err" id="err" role="alert"></div>
  <button id="go">Sign in</button>
  <a href="/login">Not the admin? Sign in with Google</a>
</form>
<script>
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const b = document.getElementById("go"), err = document.getElementById("err");
  b.disabled = true; b.textContent = "Checking…"; err.textContent = "";
  try{
    const r = await fetch("/auth/admin", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({password:document.getElementById("pw").value})});
    const d = await r.json().catch(() => ({}));
    if(r.ok){ location.href = "/"; return; }
    err.textContent = d.error || "Could not sign in.";
  }catch(e){ err.textContent = "Could not reach the server."; }
  b.disabled = false; b.textContent = "Sign in";
});
</script>
</body>
</html>
