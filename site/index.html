<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TradeReady</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="NSE F&O swing setups, market strength and big-money flows. Updated every hour.">
<meta name="theme-color" content="#f6f4ef">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="TradeReady">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Layout: desktop = fixed left rail + 12-col content grid; phone = top bar + bottom tab bar, one column.
   Themes: Graphite & Neon (dark) and Sand & Indigo (light), the two looks Vivek picked. */
:root{
  --bg:#f6f4ef; --bg2:#eceaff; --surface:#ffffff; --surface2:#f4f3fb; --line:#e6e3f3; --ink:#1e1b4b; --muted:#6b6894; --faint:#a3a1c2;
  --accent:#4f46e5; --accent2:#7c3aed; --on-accent:#ffffff; --up:#0f8a5f; --down:#e03131; --warn:#d9480f; --info:#2563eb;
  --shadow:0 6px 24px rgba(79,70,229,.09); --glow:none; --chip-bg:.12; --mark-bg:linear-gradient(135deg,#4f46e5,#7c3aed); --mark-fg:#ffffff; --mark-line:transparent;
  --f-ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-head:"Space Grotesk",Inter,system-ui,sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f11; --bg2:#141416; --surface:#18181b; --surface2:#1f1f23; --line:#2a2a2f; --ink:#f2f2f2; --muted:#9a9aa2; --faint:#5e5e66;
  --accent:#c6ff3d; --accent2:#22d3ee; --on-accent:#111111; --up:#b9f53c; --down:#ff5c5c; --warn:#ff8a3d; --info:#22d3ee;
  --shadow:none; --glow:0 0 24px rgba(198,255,61,.18); --chip-bg:.14; --mark-bg:#151517; --mark-fg:#c6ff3d; --mark-line:#2c2c31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f11; --bg2:#141416; --surface:#18181b; --surface2:#1f1f23; --line:#2a2a2f; --ink:#f2f2f2; --muted:#9a9aa2; --faint:#5e5e66;
  --accent:#c6ff3d; --accent2:#22d3ee; --on-accent:#111111; --up:#b9f53c; --down:#ff5c5c; --warn:#ff8a3d; --info:#22d3ee;
  --shadow:none; --glow:0 0 24px rgba(198,255,61,.18); --chip-bg:.14; --mark-bg:#151517; --mark-fg:#c6ff3d; --mark-line:#2c2c31; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 500px at 70% -10%,var(--bg2),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}

/* ---------- shell ---------- */
.rail{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{font-family:var(--f-head);font-weight:700;font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--mark-bg);color:var(--mark-fg);box-shadow:inset 0 0 0 1px var(--mark-line),var(--glow)}
.brand .mark svg{width:22px;height:22px}
.brand b{color:var(--accent)}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.tbtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.tbtn svg{width:17px;height:17px}
@media (max-width:600px){.dchart text{font-size:22px}}
@media (max-width:420px){.top-r{gap:5px}.tbtn{width:32px;height:32px;border-radius:10px}.top .pill{padding:6px 8px}.top .brand{font-size:18px;gap:7px}}

main{padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:12px}
.tabbar a svg{width:21px;height:21px}
.tabbar a.on{color:var(--accent)}
.tabbar a.on svg{filter:drop-shadow(var(--glow))}

@media (min-width:960px){
  .top,.tabbar{display:none}
  body::before{display:none}
  .rail{display:flex;flex-direction:column;gap:6px;position:fixed;top:0;bottom:0;left:0;width:236px;padding:22px 16px;
    padding-left:max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 70%,transparent);border-right:1px solid var(--line);backdrop-filter:blur(10px)}
  .rail .brand{margin:2px 8px 22px}
  .rail nav{display:flex;flex-direction:column;gap:3px}
  .rail nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--muted)}
  .rail nav a svg{width:19px;height:19px}
  .rail nav a:hover{background:var(--surface2);color:var(--ink)}
  .rail nav a.on{background:var(--ink);color:var(--bg)}
  .rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--surface2);font-size:12px;color:var(--muted)}
  .rail .foot button svg{width:16px;height:16px}
  .rail .foot button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--ink);font-size:12.5px}
  main{margin-left:236px;padding-block:26px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
}

/* ---------- page head ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-family:var(--f-head);font-size:clamp(26px,4vw,34px);letter-spacing:-.035em;line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
.head .sub{color:var(--muted);font-size:13px;margin-top:6px}
.stamp{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.stamp .live{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 50%,transparent)}50%{box-shadow:0 0 0 6px transparent}}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.grid>*{grid-column:span 12;min-width:0}
@media (min-width:760px){.s6{grid-column:span 6!important}}
@media (min-width:1180px){.s4{grid-column:span 4!important}.s5{grid-column:span 5!important}.s7{grid-column:span 7!important}.s8{grid-column:span 8!important}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.ct{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ct h2{margin:0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.ct h2 em{font-style:normal;color:var(--ink);margin-left:6px;letter-spacing:0}
.ct a.more{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;
  color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) calc(var(--chip-bg)*100%),transparent)}
:root[data-theme="dark"] .chip,.dark-chips .chip{background:transparent;border:1px solid color-mix(in srgb,var(--c,var(--muted)) 55%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{background:transparent;border:1px solid color-mix(in srgb,var(--c,var(--muted)) 55%,transparent)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- index strip ---------- */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ix{scroll-snap-align:start;padding:14px 14px 10px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.ix .n{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.ix .v{font-family:var(--f-num);font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.ix .c{font-family:var(--f-num);font-size:12.5px;font-weight:700}
.ix svg{width:100%;height:46px;margin-top:6px;display:block}
.ix .chips{margin-top:8px}
.ix .chip{font-size:10.5px;padding:2px 7px}

/* ---------- strength ---------- */
.hero{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:700px){.hero{grid-template-columns:minmax(230px,300px) 1fr;align-items:center}}
.gauge{position:relative;max-width:300px;margin:0 auto;width:100%}
.gauge svg{width:100%;display:block}
.gauge .big{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.gauge .big b{font-family:var(--f-num);font-size:54px;font-weight:800;letter-spacing:-.05em;line-height:1;display:block}
.gauge .big span{font-family:var(--f-head);font-size:15px;font-weight:700;letter-spacing:.02em}
.advice{font-family:var(--f-head);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.25;text-wrap:balance;margin:0 0 4px}
.parts{display:grid;gap:9px;margin-top:14px}
.part{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:12.5px}
.part .lab{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c,var(--accent))}
.part .val{font-family:var(--f-num);font-weight:700;text-align:right;font-size:12px}
.breadth{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.breadth b{color:var(--ink);font-family:var(--f-num)}
.adbar{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:6px;width:160px;background:var(--surface2)}
.adbar i{display:block}

/* ---------- trades ---------- */
.trades{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.trade{background:var(--surface2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;border:1px solid transparent}
.trade:hover{border-color:var(--line)}
.trade .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sym{font-family:var(--f-num);font-weight:800;font-size:16px;letter-spacing:-.01em}
.sym small{display:block;font-family:var(--f-ui);font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:2px}
.grade{min-width:30px;height:30px;padding:0 7px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--accent);color:var(--on-accent);box-shadow:var(--glow)}
.grade.b{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.trade svg.mini{width:100%;height:64px;display:block}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lv div{background:var(--surface);border-radius:10px;padding:7px 6px;text-align:center}
.lv small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lv b{font-family:var(--f-num);font-size:12.5px}
.rr{white-space:nowrap;font-family:var(--f-num);font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.why{font-size:12px;color:var(--muted);line-height:1.4}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .r{text-align:right;font-family:var(--f-num);font-size:12px}
.empty{padding:18px;border-radius:14px;background:var(--surface2);color:var(--muted);font-size:13px;text-align:center}

/* ---------- strongest ---------- */
.st{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st .rk{font-family:var(--f-num);font-weight:800;font-size:13px;color:var(--muted);padding-top:2px}
.st:nth-child(-n+3) .rk{color:var(--accent)}
.st .scr{font-family:var(--f-num);font-weight:800;font-size:15px;text-align:right}
.st .sbar{height:4px;border-radius:9px;background:var(--surface2);margin:6px 0 7px;overflow:hidden}
.st .sbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.st .chips .chip{font-size:10.5px;font-weight:600}

/* ---------- quadrants ---------- */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{border-radius:14px;padding:12px;background:color-mix(in srgb,var(--c) 9%,var(--surface2));border:1px solid color-mix(in srgb,var(--c) 25%,transparent);min-width:0}
.q h3{margin:0;font-size:12px;font-weight:700;color:var(--c);display:flex;justify-content:space-between;align-items:baseline}
.q h3 b{font-family:var(--f-num);font-size:24px;letter-spacing:-.03em}
.q .hint{font-size:10.5px;color:var(--muted);margin:1px 0 8px}
.q ol{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:12px}
.q li{display:flex;justify-content:space-between;gap:6px}
.q li span:first-child{font-family:var(--f-num);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.q li span:last-child{font-family:var(--f-num);color:var(--muted)}
.sub-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

/* ---------- heatmap ---------- */
.heat{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.hs{min-width:0}
.hs h4{margin:0 0 5px;font-size:11.5px;font-weight:700;display:flex;justify-content:space-between;color:var(--muted)}
.hs h4 span:last-child{font-family:var(--f-num)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:3px}
.tile{border-radius:7px;padding:6px 5px;min-height:42px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  background:color-mix(in srgb,var(--hc) var(--hp),var(--surface2));text-align:center;overflow:hidden}
.tile b{font-family:var(--f-num);font-size:10.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{font-family:var(--f-num);font-size:10px;font-weight:600;opacity:.85}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.legend i{display:block;width:120px;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--down),var(--surface2),var(--up))}

/* ---------- movers / sectors ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.mv:first-of-type{border-top:0}
.mv b{font-family:var(--f-num)}
.rs{display:grid;grid-template-columns:minmax(0,130px) 1fr 54px;gap:10px;align-items:center;padding:6px 0;font-size:12.5px}
.rs .nm{display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs .nm i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.dv{position:relative;height:10px}
.dv::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.dv i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--c)}
.rs .v{text-align:right;font-family:var(--f-num);font-weight:700}
.stages{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.stages span{display:flex;align-items:center;gap:5px}
.stages i{width:8px;height:8px;border-radius:50%;background:var(--c)}

.wl{display:flex;flex-wrap:wrap;gap:8px}
.wl a{display:flex;flex-direction:column;gap:1px;padding:9px 12px;border-radius:12px;background:var(--surface2);border:1px solid transparent;min-width:104px}
.wl a.rdy{border-color:color-mix(in srgb,var(--up) 50%,transparent);background:color-mix(in srgb,var(--up) 8%,var(--surface2))}
.wl b{font-family:var(--f-num);font-size:12.5px}
.wl span{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.wl em{font-style:normal;font-size:10px;font-weight:700;color:var(--up);letter-spacing:.05em}

.soon{max-width:560px;margin:8vh auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.soon h1{font-family:var(--f-head);font-size:30px;letter-spacing:-.03em;margin:0}
.soon p{color:var(--muted);margin:0;max-width:44ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:var(--glow)}
.foot-note{font-size:11.5px;color:var(--faint);text-align:center;margin-top:22px}

@media (max-width:520px){
  .two{grid-template-columns:1fr}
  .part{grid-template-columns:96px 1fr 30px}
  .rs{grid-template-columns:minmax(0,104px) 1fr 48px}
  .gauge .big b{font-size:48px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- sub-navigation, filters ---------- */
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding-bottom:2px}
.subnav::-webkit-scrollbar{display:none}
.subnav a,.subnav button{flex:none;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.subnav a.on,.subnav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.filters button{font-size:12px;font-weight:700;padding:6px 11px;border-radius:10px;background:var(--surface2);color:var(--muted);border:1px solid transparent}
.filters button.on{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--ink);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.filters button i{font-style:normal;font-family:var(--f-num);opacity:.7;margin-left:4px}
.headline{font-family:var(--f-head);font-size:clamp(20px,3vw,24px);font-weight:600;letter-spacing:-.025em;margin:2px 0 4px;text-wrap:balance}
.lead{color:var(--muted);font-size:13px;max-width:72ch}
.meter{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin:10px 0 2px;max-width:420px}
.meter i{display:block;height:100%;background:var(--up);border-radius:9px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.cards>*{min-width:0}

/* ---------- setup card ---------- */
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--stc,transparent)}
.sc .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.symrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.star{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--faint);flex:none}
.star svg{width:17px;height:17px}
.star.on{color:var(--warn)}
.star.on svg{fill:currentColor}
.star:hover{background:var(--surface2)}
.px{font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.states{display:flex;gap:4px;flex-wrap:wrap}
.states span{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--sc,var(--muted))}
.states span b{color:var(--muted);font-weight:700;margin-right:3px}
.detail{font-size:12.5px;color:var(--muted);line-height:1.45}
.checks{display:grid;gap:3px;font-size:12px}
.checks div{display:flex;gap:6px}
.checks div::before{content:"✓";color:var(--up);font-weight:800}
.checks div.bonus{color:var(--up);font-weight:600}
.checks div.bonus::before{content:"+"}
.extra{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;display:grid;gap:3px}
.extra b{color:var(--ink);font-weight:600}

/* ---------- strategy ---------- */
.strat{display:flex;flex-direction:column;gap:12px}
.strat .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.strat h3{margin:0;font-family:var(--f-head);font-size:19px;letter-spacing:-.02em}
.strat h3 span{font-family:var(--f-num);color:var(--accent);margin-right:8px}
.gate{font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);max-width:100%}
details{border-radius:12px;background:var(--surface2);padding:10px 12px}
details summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted)}
details ul{margin:8px 0 2px;padding-left:18px;font-size:12.5px;display:grid;gap:4px}
details p{font-size:12.5px;margin:8px 0 0}
.toggle-more{display:flex;justify-content:center;margin:6px 0 0}
.toggle-more button{font-weight:700;font-size:13px;padding:10px 16px;border-radius:12px;border:1px dashed var(--line);color:var(--muted)}

/* ---------- index page ---------- */
.ixhero{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.ixhero{grid-template-columns:minmax(0,1fr) 300px}}
.ixhero .val{font-family:var(--f-num);font-size:clamp(34px,6vw,48px);font-weight:800;letter-spacing:-.04em;line-height:1}
.bigchart svg{width:100%;height:180px;display:block}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface2);border-radius:12px;padding:10px}
.kv small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv b{font-family:var(--f-num);font-size:16px}
.ladder{display:grid;gap:3px;font-size:11px}
.lad{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:6px}
.lad .s{font-family:var(--f-num);text-align:center;font-weight:700;color:var(--muted);border-radius:6px;padding:1px 0}
.lad .s.atm{background:var(--ink);color:var(--bg)}
.lad .ce{display:flex;justify-content:flex-end}
.lad .ce i,.lad .pe i{display:block;height:10px;border-radius:3px}
.lad .ce i{background:var(--down)}
.lad .pe i{background:var(--up)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
table.t th.n{text-align:right}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}

/* ---------- RRG ---------- */
.rrg svg{width:100%;height:auto;display:block;max-height:440px}
.ev{display:grid;grid-template-columns:4px 1fr;gap:8px;font-size:12px}
.ev i{border-radius:3px;background:var(--c)}
.ev .w{color:var(--muted);font-family:var(--f-num);font-size:11px}

/* ---------- watchlist + search ---------- */
.inrow{display:flex;gap:8px;flex-wrap:wrap}
.in{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.in:focus{outline:2px solid var(--accent);outline-offset:0}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.btn2.danger{color:var(--down)}
.btn2[disabled],.btn[disabled]{opacity:.5;cursor:not-allowed}
textarea.note{width:100%;min-height:64px;resize:vertical;font:inherit;font-size:13px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.wlc{display:flex;flex-direction:column;gap:9px}
.wlc .acts{display:flex;gap:8px;justify-content:flex-end}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin:22px 0 10px}
.sec-h h2{margin:0;font-family:var(--f-head);font-size:18px;letter-spacing:-.02em}
.sec-h span{font-size:12px;color:var(--muted)}
.big-sym{font-family:var(--f-num);font-size:clamp(28px,5vw,36px);font-weight:800;letter-spacing:-.03em}

/* ---------- modal + toast ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px}
.modal .box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{margin:0;font-family:var(--f-head);font-size:20px}
.modal p{margin:0;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
@media (min-width:960px){.toast{bottom:24px;left:calc(50% + 118px)}}
.scanline{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.rail .foot .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rail .foot .me{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink);padding-top:4px;border-top:1px solid var(--line)}
.rail .foot .me span:not(.av){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .foot .me img,.rail .foot .me .av{width:26px;height:26px;border-radius:50%;flex:none}
.rail .foot .me .av{display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-weight:800}
.rail .foot .me a{color:var(--muted);display:grid;place-items:center}
.rail .foot .me a svg{width:17px;height:17px}
a.tbtn{color:var(--ink)}
.rail .foot .acts button{justify-content:center}

/* ---------- right panel (wide screens only) ---------- */
.rrail{display:none}
@media (min-width:1500px){
  .rrail{display:flex;flex-direction:column;gap:12px;position:fixed;top:0;bottom:0;right:0;width:300px;overflow-y:auto;scrollbar-width:thin;
    padding:22px 18px;padding-right:max(18px,env(safe-area-inset-right,0px));border-left:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(10px)}
  main{margin-right:300px;max-width:none}
}
.rrail .rp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.rrail h3{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.rrail h3 a{font-size:11px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:700}
.rrail .pulse{display:flex;align-items:center;gap:14px}
.rrail .ring{width:66px;height:66px;flex:none;position:relative}
.rrail .ring svg{width:66px;height:66px;transform:rotate(-90deg)}
.rrail .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:20px;font-weight:800}
.rrail .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.rrail .row:first-of-type{border-top:0}
.rrail .row .num{font-weight:700}
.rrail .when{font-size:11px;color:var(--muted);text-align:center;margin-top:auto;padding-top:6px}

/* ---------- mast: bell strip, weather, headline, flip cards, motion ---------- */
:root{--sky1:#bfe3ff;--sky2:#eef7ff;--sun:#ffb020;--cloud:#ffffff;--rain:#4f8cff;--gold1:#f7d774;--gold2:#c9922b;--silver1:#eef0f6;--silver2:#9aa3b5;--wxink:#1e1b4b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky1:#1b2a4a;--sky2:#121826;--sun:#ffc94a;--cloud:#d8deea;--rain:#6fa8ff;--gold2:#b07a1c;--silver1:#3a3d46;--wxink:#f2f2f2}}
:root[data-theme="dark"]{--sky1:#1b2a4a;--sky2:#121826;--sun:#ffc94a;--cloud:#d8deea;--rain:#6fa8ff;--gold2:#b07a1c;--silver1:#3a3d46;--wxink:#f2f2f2}
.bell{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.bell .state{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;flex-wrap:wrap}
.bell .bdot{width:10px;height:10px;border-radius:50%;background:var(--c);animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.bell .count{font-family:var(--f-num);font-weight:800;font-size:14px;padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.bell .bsub{font-weight:500;font-size:12.5px;color:var(--muted)}
.ribbon{display:flex;gap:3px;align-items:flex-end;height:26px}
.ribbon i{display:block;width:10px;border-radius:3px 3px 0 0;background:var(--c);transform-origin:bottom;animation:growy .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes growy{from{transform:scaleY(0)}}
.wx{position:relative;border-radius:var(--r);overflow:hidden;min-height:280px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  background:linear-gradient(180deg,var(--sky1),var(--sky2));border:1px solid var(--line);box-shadow:var(--shadow)}
.wx[data-w="rain"]{--sky1:#c9d3e6;--sky2:#eef2f8}
.wx[data-w="storm"]{--sky1:#5b6478;--sky2:#9aa3b5;--wxink:#ffffff}
:root[data-theme="dark"] .wx[data-w="rain"],:root[data-theme="dark"] .wx[data-w="storm"]{--sky1:#151a26;--sky2:#0f1219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wx[data-w="rain"],:root:not([data-theme="light"]) .wx[data-w="storm"]{--sky1:#151a26;--sky2:#0f1219}}
.wx .scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wx>*:not(.scene){position:relative}
.wx .lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--wxink);opacity:.7}
.wx .score{font-family:var(--f-num);font-size:72px;font-weight:800;letter-spacing:-.05em;line-height:.9;color:var(--wxink)}
.wx .word{font-family:var(--f-head);font-size:21px;font-weight:700;color:var(--wxink)}
.wx .say{font-size:13.5px;font-weight:600;color:var(--wxink);max-width:32ch;line-height:1.4;margin-top:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
@keyframes drop{from{transform:translateY(-20px);opacity:0}20%{opacity:1}to{transform:translateY(120px);opacity:0}}
@keyframes flash{0%,92%,100%{opacity:0}94%,96%{opacity:.9}}
.news{display:flex;flex-direction:column;gap:12px}
.news .date{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:8px;gap:8px}
.news .date b{font-family:var(--f-head);font-size:14.5px}
.news h1{font-family:var(--f-head);font-size:clamp(26px,3.6vw,40px);line-height:1.05;letter-spacing:-.035em;margin:0;text-wrap:balance}
.news h1 em{font-style:normal;color:var(--accent)}
:root[data-theme="dark"] .news h1 em{color:var(--accent)}
.news h1 s{text-decoration:none;color:var(--down)}
.news .deck{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0;max-width:64ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fact{background:var(--surface2);border-radius:12px;padding:9px 11px}
.fact small{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fact b{font-family:var(--f-num);font-size:19px}
.bar i,.sbar i{transform-origin:left;animation:growx .9s cubic-bezier(.2,.8,.2,1) both}
.dv i{animation:fadein .9s ease both}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes fadein{from{opacity:0}}
.flipgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tc{perspective:1200px;height:330px;animation:cardin .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardin{from{opacity:.001;transform:translateY(14px)}}
.tc .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.tc.flip .in{transform:rotateY(180deg)}
.tc .face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:15px;display:flex;flex-direction:column;gap:9px;overflow:hidden;
  border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--silver1),var(--silver2),var(--silver1)) border-box}
.tc.gA .face{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--gold1),var(--gold2),var(--gold1)) border-box}
.tc.gA .front::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,236,170,.45) 50%,transparent 58%);transform:translateX(-60%);animation:shine 4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-60%)}85%,100%{transform:translateX(60%)}}
.tc .back{transform:rotateY(180deg)}
.tc .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tc .sub{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.rar{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.rar b{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:16px;color:#3b2a00;background:linear-gradient(135deg,var(--gold1),var(--gold2))}
.tc.gB .rar b{color:#1e1b4b;background:linear-gradient(135deg,var(--silver1),var(--silver2))}
.rar span{font-size:8.5px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.tc{height:390px}
.tc .fchart{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.legend2{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.legend2 span{display:flex;align-items:center;gap:4px}
.legend2 i{display:block;width:12px;height:2px;border-radius:2px;background:var(--c)}
.fstats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.fstats div{background:var(--surface2);border-radius:9px;padding:6px 7px;min-width:0}
.fstats small{display:block;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fstats b{font-family:var(--f-num);font-size:12px;white-space:nowrap}
.wx .wxstats{display:flex;gap:8px;flex-wrap:wrap}
.wx .wxstats span{font-size:12px;font-weight:700;color:var(--wxink);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.55);backdrop-filter:blur(6px)}
:root[data-theme="dark"] .wx .wxstats span{background:rgba(0,0,0,.35)}
.tc .foot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--faint)}
.tc .lvv{display:grid;gap:7px}
.tc .lvv div{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:11px;padding:9px 11px}
.tc .lvv small{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tc .lvv b{font-family:var(--f-num);font-size:15px}
.sharebtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;margin-top:auto}
.skel{display:grid;gap:14px}
.skel i{display:block;border-radius:16px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.card,.sc,.trade,.btn,.btn2,.tbtn,.filters button,.subnav a{transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease}
@media (hover:hover){.card:hover,.sc:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(79,70,229,.13)}}
.btn:active,.btn2:active,.tbtn:active,.filters button:active,.subnav a:active,.star:active{transform:scale(.96)}
.grid>.fade:nth-child(1){animation-delay:0ms}.grid>.fade:nth-child(2){animation-delay:60ms}.grid>.fade:nth-child(3){animation-delay:120ms}.grid>.fade:nth-child(4){animation-delay:180ms}
.grid>.fade:nth-child(5){animation-delay:240ms}.grid>.fade:nth-child(6){animation-delay:300ms}.grid>.fade:nth-child(n+7){animation-delay:340ms}
@media (prefers-reduced-motion:reduce){.tc .in{transition:none}}
.chip.newb{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;letter-spacing:.06em;animation:newp 2.4s ease-in-out infinite}
:root[data-theme="dark"] .chip.newb{color:#111}
@keyframes newp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.installhint{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;

<body>
<aside class="rail" id="rail"></aside>
<aside class="rrail" id="rrail" aria-label="Market pulse"></aside>
<header class="top" id="top"></header>
<main id="main"></main>
<nav class="tabbar" id="tabbar" aria-label="Pages"></nav>
<script>
/* ============================================================ TradeReady web app */
const DATA_BASE = "https://raw.githubusercontent.com/kapoorvivek4u-bit/trendfire_2.0/main/data/";
window.SNAP = window.SNAP || null; /*__SNAPSHOT__*/
const CACHE = {};            // file name -> parsed JSON
let WATCH = [], WATCH_LIVE = false;
const UI = { strong: "fo", strongMarket: "fo", setup: {}, stage: {}, pat: "All", vk: null, lean: "All", umarket: "F&O",
             star: "All", more: false, search: "", dealSide: "All" };

let ADMIN_D = null;
const SAVED_TRIED = {};
async function getJSON(name, fresh){
  if(CACHE[name] && !fresh) return CACHE[name];
  if(window.SNAP && window.SNAP.files && window.SNAP.files[name]){ CACHE[name] = window.SNAP.files[name]; return CACHE[name]; }
  // instant open: use the copy saved on this phone (under 12 hours old), then fetch the fresh one quietly
  if(!fresh && !SAVED_TRIED[name] && "caches" in window){
    SAVED_TRIED[name] = 1;
    try{
      const hit = await caches.match(location.origin + "/data/" + name);
      const age = hit ? Date.now() - Date.parse(hit.headers.get("date") || 0) : Infinity;
      if(hit && age < 12 * 3600e3){
        CACHE[name] = await hit.json();
        if(name === "site.json") applyLive();
        netJSON(name).then(j => { const old = CACHE[name];
          if(JSON.stringify(j).length !== JSON.stringify(old).length || (j.generated_ist && j.generated_ist !== old.generated_ist)){
            CACHE[name] = j; if(name === "site.json") applyLive(); rerender(); } }).catch(() => null);
        return CACHE[name];
      }
    }catch(e){}
  }
  CACHE[name] = await netJSON(name);
  if(name === "site.json") applyLive();
  return CACHE[name];
}
async function netJSON(name){
  const t = "?t=" + Math.floor(Date.now()/60000);
  let r = null;
  try{ r = await fetch("/data/" + name + t); if(r.status === 401){ location.href = "/login"; throw new Error("signed out"); }
       if(!r.ok || !(r.headers.get("content-type") || "").includes("json")) r = null; }catch(e){ if(e.message === "signed out") throw e; r = null; }
  if(!r) r = await fetch(DATA_BASE + name + t, {cache:"no-store"});
  if(!r.ok) throw new Error(name + " " + r.status);
  return await r.json();
}
const S = () => CACHE["site.json"];
/* Live prices (every 15 min in market hours) laid over the last-session heatmap, movers and advance/decline. */
let LIVE = null;
async function loadLive(){
  if(window.SNAP) return;
  try{ const r = await fetch("/api/live?t=" + Date.now(), {cache:"no-store"}); LIVE = r.ok ? await r.json() : {why: "server " + r.status}; }catch(e){ LIVE = {why: "could not reach the server"}; }
  applyLive();
}
const livePx = sym => { const s = CACHE["site.json"]; if(!s || !s._live || !LIVE || !LIVE._by) return null; return LIVE._by[sym] || null; };
const liveTag = sym => { const q = livePx(sym); return q ? `<span class="livepx" title="Live ${esc(S()._live)}, a few minutes late">● ${fmt(q.close)} <b class="${cls(q.chg)}">${pct(q.chg, 2)}</b></span>` : ""; };
/* Walls: 200-day SMA and 20/50-week EMA just above the price (within 4%). */
const LV_NAMES = {d200:"200 DMA", w20:"20W EMA", w50:"50W EMA"};
function walls(sym){
  const lv = ((S() || {}).levels || {})[sym]; if(!lv) return null;
  const q = livePx(sym), px = q ? q.close : lv.c;
  const above = Object.keys(LV_NAMES).filter(k => lv[k] != null).map(k => ({k, name: LV_NAMES[k], v: lv[k], d: (lv[k] / px - 1) * 100}))
    .filter(x => x.d >= 0 && x.d <= 15).sort((a,b) => a.d - b.d);
  return {px, above, near: above.filter(x => x.d <= 4), known: Object.keys(LV_NAMES).filter(k => lv[k] != null).length};
}
const hasWall = sym => { const w = walls(sym); return !!(w && w.near.length); };
/* chase meter: how far the price is from its daily 20 EMA, in average daily ranges (ATR) */
function chase(sym, px){
  const lv = ((S() || {}).levels || {})[sym]; if(!lv || !lv.e20 || !lv.a) return null;
  const q = livePx(sym), p = px ?? (q ? q.close : lv.c); if(p == null) return null;
  const x = (p - lv.e20) / lv.a;
  const z = x > 2.5 ? ["🔴","Don't chase","var(--down)","far above its 20 EMA: wait for a pullback"]
    : x > 1 ? ["🟡","Wait for a dip","#e0a400","a bit stretched: a dip toward the 20 EMA is a better entry"]
    : x >= -1.5 ? ["🟢","Good entry zone","var(--up)","close to its 20 EMA: low-risk area if the trend is up"]
    : ["⚪","Below 20 EMA","var(--muted)","under its 20 EMA: wait for it to turn back up"];
  return {x, icon:z[0], label:z[1], color:z[2], why:z[3], e20:lv.e20};
}
const chaseChip = (sym, short) => { const c = chase(sym); if(!c) return "";
  return `<span class="chip" style="--c:${c.color}" title="Chase meter: ${c.x >= 0 ? "+" : ""}${c.x.toFixed(1)} ATR from the 20 EMA (₹${fmt(c.e20)}), ${esc(c.why)}">${c.icon} ${short ? "" : esc(c.label) + " · "}${c.x >= 0 ? "+" : ""}${c.x.toFixed(1)}</span>`; };
function wallChips(sym){
  const w = walls(sym); if(!w || !w.known) return "";
  if(!w.above.length){ const lv = S().levels[sym];
    return `<span class="chip" style="--c:var(--up)" title="${Object.keys(LV_NAMES).filter(k => lv[k] != null).map(k => `${LV_NAMES[k]} ${fmt(lv[k])}`).join(" · ")}: none within 15% above">✓ No 200 DMA / weekly EMA wall</span>`; }
  return w.above.map(x => x.d <= 4 ? `<span class="chip" style="--c:var(--warn)" title="${esc(x.name)} at ${fmt(x.v)}: likely resistance">⚠ ${esc(x.name)} ${x.d.toFixed(1)}% above</span>`
    : `<span class="chip" title="${esc(x.name)} at ${fmt(x.v)}">${esc(x.name)} ${x.d.toFixed(1)}% above</span>`).join("");
}
function applyLive(){
  const s = CACHE["site.json"];
  if(!s) return;
  const today = new Date(Date.now() + 5.5*3600e3).toISOString().slice(0,10);
  if(!s._orig) s._orig = {heatmap: s.heatmap, gainers: s.gainers, losers: s.losers, adv: (s.market||{}).adv, dec: (s.market||{}).dec};
  if(!LIVE || !LIVE.rows || LIVE.session !== today){
    s._live = null; s._liveWhy = !LIVE ? "not loaded" : LIVE.why || (!LIVE.rows ? "no live scan stored yet" : `last live scan is from ${LIVE.session}`);
    s.heatmap = s._orig.heatmap; s.gainers = s._orig.gainers; s.losers = s._orig.losers; s.market.adv = s._orig.adv; s.market.dec = s._orig.dec;
    return; }
  const by = Object.fromEntries(LIVE.rows.map(([sym, c, chg, sec]) => [sym, {symbol: sym, close: c, chg, sector: sec}]));
  LIVE._by = by;
  s.heatmap = (s._orig.heatmap || []).map(g => { const stocks = g.stocks.map(x => by[x.symbol] ? {...x, chg: by[x.symbol].chg, close: by[x.symbol].close} : x).sort((a,b) => b.chg - a.chg);
    return {...g, stocks, avg: +(stocks.reduce((a,x) => a + (x.chg || 0), 0) / (stocks.length || 1)).toFixed(2)}; });
  const rows = Object.values(by).filter(x => x.chg != null).map(x => ({...x, sector: x.sector || "Others"}));
  s.gainers = rows.slice().sort((a,b) => b.chg - a.chg).slice(0, 8);
  s.losers = rows.slice().sort((a,b) => a.chg - b.chg).slice(0, 8);
  s.market.adv = rows.filter(x => x.chg > 0).length; s.market.dec = rows.length - s.market.adv;
  s._live = (String(LIVE.at).match(/\d{1,2}:\d{2}$/) || [""])[0];
}

async function loadWatch(){
  if(!isAdmin()){ WATCH = []; return; }
  try{
    const r = await fetch("/api/watch", {cache:"no-store"});
    if(r.ok){ const d = await r.json(); if(d.items){ WATCH = d.items; WATCH_LIVE = true; return; } }
  }catch(e){}
  try{ WATCH = await getJSON("watchlist.json", true); }catch(e){ WATCH = (window.SNAP && window.SNAP.watch) || []; }
  if(!Array.isArray(WATCH)) WATCH = [];
}
const inWatch = s => WATCH.some(w => w.symbol === s);

/* ============================================================ helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (x, d) => x == null || isNaN(x) ? "—" : Number(x).toLocaleString("en-IN", {minimumFractionDigits: d ?? (Math.abs(x) >= 1000 ? 1 : 2), maximumFractionDigits: d ?? (Math.abs(x) >= 1000 ? 1 : 2)});
const pct = (x, d=1) => x == null ? "—" : (x > 0 ? "+" : "") + Number(x).toFixed(d) + "%";
const cls = x => x > 0 ? "up" : x < 0 ? "down" : "muted";
const tv = s => "https://www.tradingview.com/chart/?symbol=NSE:" + encodeURIComponent(String(s).replace(/[&-]/g, "_"));
const chip = (t, c="var(--muted)") => t ? `<span class="chip" style="--c:${c}">${esc(t)}</span>` : "";
const STAGE_C = {Leading:"var(--up)", Improving:"var(--info)", Weakening:"var(--warn)", Lagging:"var(--down)"};
const SETUP_STAGE_C = {Ready:"var(--up)", Triggered:"var(--info)", Watch:"var(--warn)"};
const TREND_C = {"With trend":"var(--up)", "Early turn":"var(--info)", "Counter-trend":"var(--down)"};
const STATE_C = {Impulse:"var(--up)", Bullish:"var(--up)", Bottoming:"var(--info)", Topping:"var(--warn)", Bearish:"var(--down)"};
const VK_SHORT = {"BUY NOW":["VK Buy now ▲","var(--up)"], "ALMOST READY (Bullish)":["VK Almost ready ▲","var(--up)"],
  "COMING CLOSE TO READY (Bullish)":["VK Coming close ▲","var(--info)"], "SELL NOW":["VK Sell now ▼","var(--down)"],
  "ALMOST READY (Bearish)":["VK Almost ready ▼","var(--down)"], "COMING CLOSE TO READY (Bearish)":["VK Coming close ▼","var(--warn)"],
  "SIGNAL ON (Bullish)":["VK Signal on ▲","var(--up)"], "SIGNAL ON (Bearish)":["VK Signal on ▼","var(--down)"]};
// Members without full access get "Signal on" in place of Buy now / Sell now (the server renames it).
const FULL = () => !USER || USER.role === "admin" || !!USER.full;
const vkOn = side => FULL() ? (side > 0 ? "BUY NOW" : "SELL NOW") : (side > 0 ? "SIGNAL ON (Bullish)" : "SIGNAL ON (Bearish)");
const vkOrder = () => [vkOn(1),"ALMOST READY (Bullish)","COMING CLOSE TO READY (Bullish)",vkOn(-1),"ALMOST READY (Bearish)","COMING CLOSE TO READY (Bearish)","NO SIGNAL"];
const VK_ORDER = ["BUY NOW","ALMOST READY (Bullish)","COMING CLOSE TO READY (Bullish)","SELL NOW","ALMOST READY (Bearish)","COMING CLOSE TO READY (Bearish)","NO SIGNAL"];
const vkChip = v => VK_SHORT[v] ? chip(VK_SHORT[v][0], VK_SHORT[v][1]) : "";
const plural = (n, a, b) => `${n} ${n === 1 ? a : (b || a + "s")}`;
const when = s => { try{ const d = new Date(s.replace(" ", "T") + ":00+05:30");
  return d.toLocaleString("en-IN", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Asia/Kolkata"}); }catch(e){ return s; } };

function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function spark(vals, {h=46, fill=true, color, w=200} = {}){
  if(!vals || vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const pts = vals.map((v,i) => [i/(vals.length-1)*w, h - 4 - (v-mn)/rg*(h-10)]);
  const col = color || (vals[vals.length-1] >= vals[0] ? "var(--up)" : "var(--down)");
  const id = "g" + Math.random().toString(36).slice(2,8);
  const line = pts.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${fill ? `<polygon points="0,${h} ${line} ${w},${h}" fill="url(#${id})"/>` : ""}
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${col}"/></svg>`;
}

function miniChart(ch, sym){
  try{
    const lq = sym ? livePx(sym) : null;
    const H = ch.h, L = ch.l, C = ch.c, N = C.length + (lq ? 1 : 0);
    const ys = H.concat(L, Object.values(ch.lines||{}).flatMap(l => l.map(p => p[1])), lq ? [lq.close] : []);
    let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi-lo)*.06 || 1; lo -= pad; hi += pad;
    const W = 300, Hh = 64, X = i => (i+.5)/N*W, Y = v => (hi-v)/(hi-lo)*Hh;
    const ne = 'vector-effect="non-scaling-stroke"';
    let s = "";
    if(ch.brk != null) s += `<line x1="${X(ch.brk)}" y1="0" x2="${X(ch.brk)}" y2="${Hh}" stroke="var(--up)" stroke-width="1" opacity=".35" ${ne}/>`;
    for(let i=0;i<N;i++) s += `<line x1="${X(i)}" y1="${Y(H[i])}" x2="${X(i)}" y2="${Y(L[i])}" stroke="var(--line)" stroke-width="3" ${ne}/>`;
    s += `<polyline points="${C.map((v,i)=>X(i)+","+Y(v)).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="1.4" ${ne}/>`;
    const sty = {top:["var(--up)","5 3",1.8], floor:["var(--down)","5 3",1.5], pole:["var(--up)","",3]};
    for(const [k, [[x0,y0],[x1,y1]]] of Object.entries(ch.lines||{})){
      const [c,d,w] = sty[k] || ["var(--muted)","",1.5];
      s += `<line x1="${X(x0)}" y1="${Y(y0)}" x2="${X(x1)}" y2="${Y(y1)}" stroke="${c}" stroke-width="${w}" stroke-dasharray="${d}" opacity="${k==="pole"?.45:.95}" ${ne}/>`;
    }
    if(lq){ const i = N - 1, col = lq.chg >= 0 ? "var(--up)" : "var(--down)";

  const cell = v => { const k = mtfKind(v);

    if(k === "No data") return `<td class="muted">—</td>`;

function rateHolding(h){

  const st = fo ? {M:fo.M, W:fo.W, D:fo.D} : eqs ? {M:eqs[0], W:eqs[1], D:eqs[2]} : null;

  if(!st && !lv) return {sym, h, px, known:false};
  let score = 42; const why = [], fix = [], warn = [];
  const add = (t, p, need) => { if(!p) return; score += p; why.push({t, p: Math.round(p*10)/10}); if(p < 0 && need) fix.push({t: need, p}); };
  if(st) for(const k of ["W","M","D"]){ const v = st[k]; if(!v || v === "No data") continue;
    add(`${TF_NAME[k]} ${v === "Impulse" ? "Impulse" : "Corrective · " + v}`, ST_PTS[k][v] || 0,
      k === "D" ? null : `${TF_NAME[k]} back to Impulse (now ${v})`); }
  if(fo && fo.sc != null) add(`Strength rank ${fo.rk} of ${(s.mtf || []).length} (score ${fo.sc})`, (fo.sc - 50) * 0.2, "Relative strength vs Nifty to improve");
  const ss = fo ? fo.ss : null;
  if(ss) add(`${fo.sec} sector ${ss.toLowerCase()}`, {Leading:6, Improving:3, Weakening:-3, Lagging:-6}[ss] || 0, `${fo.sec} sector to turn Improving/Leading`);

    if(lv.d200) add(px > lv.d200 ? `Above the 200 DMA (${fmt(lv.d200)})` : `Below the 200 DMA (${fmt(lv.d200)})`, px > lv.d200 ? 5 : -10, `Close back above the 200 DMA ₹${fmt(lv.d200)}`);
    const w = walls(sym); if(w && w.near.length) add(`${w.near[0].name} ${w.near[0].d.toFixed(1)}% above: upside capped near term`, -3, `Clear the ${w.near[0].name} at ₹${fmt(w.near[0].v)}`);
  }
  if(fo && fo.oi5 != null && fo.d5 != null && Math.abs(fo.oi5) >= 3){
    if(fo.oi5 > 0) add(fo.d5 > 0 ? `Long build-up: OI ${pct(fo.oi5,0)}, price ${pct(fo.d5)} in 5 days` : `Short build-up: OI ${pct(fo.oi5,0)}, price ${pct(fo.d5)} in 5 days`, fo.d5 > 0 ? 4 : -6, "Shorts to cover (OI falling as price rises)");
    else if(fo.d5 < 0) add(`Long unwinding: OI ${pct(fo.oi5,0)}, price ${pct(fo.d5)} in 5 days`, -3, "Longs to stop exiting");
  }
  const fii = CACHE["fii.json"] || {};
  if((fii.accumulation || []).some(x => x.symbol === sym)) add("FII-style buying (FII footprint)", 4);
  if((fii.distribution || []).some(x => x.symbol === sym)) add("FII-style selling (FII footprint)", -5, "Big-player selling to stop");
  const un = ((CACHE["unusual.json"] || {}).rows || []).find(r => r.symbol === sym);
  if(un && un.bias === "Buying") add("Unusual activity: buying", 2);
  if(un && un.bias === "Selling") add("Unusual activity: selling", -4, "Unusual selling to stop");
  const vk = (s.vk || {})[sym];
  if(vk === "BUY NOW") add("VK Buy now", 3); else if(vk === "SELL NOW") add("VK Sell now", -5, "VK sell signal to clear");
  const rd = (s.ready || []).find(r => r.symbol === sym && (r.stage === "Ready" || r.stage === "Triggered"));
  if(rd) add(`Fresh ${rd.setup} setup (${rd.stage}): good place to add`, 5);
  const hu = s.heads_up || {};
  if((hu.ban || []).includes(sym)) warn.push("In the F&O ban list today");
  if(hu.results && hu.results[sym]) warn.push(`Results on ${hu.results[sym]}: expect a big move`);
  if(h.avg && px){ const pl = (px / h.avg - 1) * 100; if(pl <= -8 && score < 65) warn.push(`${pct(pl)} from your buy price and the trend isn't helping`); }
  if(!st) warn.push("Trend states not scanned for this stock yet (cash stock outside the scan list)");
  score = Math.max(0, Math.min(100, Math.round(score)));
  const cat = HOLD_CAT.find(c => score >= c[0]);
  const below = lv && px ? [["w20","20-week EMA"],["d200","200 DMA"],["w50","50-week EMA"]].filter(([k]) => lv[k] && lv[k] < px).map(([k,n]) => ({k, n, v: lv[k]})) : [];
  const stopAt = below.length ? below.reduce((a, b) => b.v > a.v ? b : a) : null;
  return {sym, h, px, q, known:true, st, score, cat:cat[1], color:cat[2], why: why.sort((a,b) => b.p - a.p), fix: fix.sort((a,b) => a.p - b.p).slice(0, 3), warn, stopAt, fo};
}
function swapIdeas(have){

  return out.slice(0, 8);
}

}

const WX = sc => sc >= 70 ? ["sun","Clear skies"] : sc >= 55 ? ["partly","Partly sunny"] : sc >= 40 ? ["rain","Light showers"] : ["storm","Storm warning"];

function bigChart(vals){
  if(!vals || vals.length < 2) return "";
  const w = 600, h = 180, mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn) || 1;
  const X = i => i/(vals.length-1)*w, Y = v => h - 14 - (v-mn)/rg*(h-28);
  const col = vals[vals.length-1] >= vals[0] ? "var(--up)" : "var(--down)";
  const line = vals.map((v,i) => X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  const grid = [0,.25,.5,.75,1].map(f => { const v = mn + f*rg; return `<line x1="0" x2="${w}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`; }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<polygon points="0,${h} ${line} ${w},${h}" fill="url(#bg1)"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.4" vector-effect="non-scaling-stroke"/></svg>`;
}

function rrg(secs){
  const W = 560, H = 380, P = 34;
  const xs = secs.map(s => s.ratio), ys = secs.map(s => s.mom);
  const xr = Math.max(...xs.map(v => Math.abs(v-1)), .01)*1.25, yr = Math.max(...ys.map(Math.abs), .005)*1.25;
  const X = v => P + (v - (1-xr))/(2*xr)*(W-2*P), Y = v => H - P - (v + yr)/(2*yr)*(H-2*P);
  const q = (x, y, t, c) => `<text x="${x}" y="${y}" font-size="11" font-weight="700" fill="${c}" opacity=".75" font-family="Inter,sans-serif">${t}</text>`;
  const fills = `<rect x="${X(1)}" y="${P}" width="${W-P-X(1)}" height="${Y(0)-P}" fill="var(--up)" opacity=".06"/><rect x="${P}" y="${P}" width="${X(1)-P}" height="${Y(0)-P}" fill="var(--info)" opacity=".06"/>
    <rect x="${P}" y="${Y(0)}" width="${X(1)-P}" height="${H-P-Y(0)}" fill="var(--down)" opacity=".06"/><rect x="${X(1)}" y="${Y(0)}" width="${W-P-X(1)}" height="${H-P-Y(0)}" fill="var(--warn)" opacity=".06"/>`;
  const dots = secs.map(s => { const cx = X(s.ratio), cy = Y(s.mom), right = cx < W - 110;
    return `<g><circle cx="${cx}" cy="${cy}" r="6" fill="${STAGE_C[s.stage]}" stroke="var(--surface)" stroke-width="2"/>
      <text x="${right ? cx + 9 : cx - 9}" y="${cy + 4}" text-anchor="${right ? "start" : "end"}" font-size="10.5" font-weight="600" fill="var(--ink)" font-family="Inter,sans-serif">${esc(s.name)}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sector rotation chart">${fills}
    <line x1="${X(1)}" x2="${X(1)}" y1="${P}" y2="${H-P}" stroke="var(--line)"/><line x1="${P}" x2="${W-P}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/>
    ${q(W-P-62, P+14, "LEADING", "var(--up)")}${q(P+6, P+14, "IMPROVING", "var(--info)")}${q(P+6, H-P-8, "LAGGING", "var(--down)")}${q(W-P-82, H-P-8, "WEAKENING", "var(--warn)")}
    <text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Inter,sans-serif">Relative strength vs Nifty →</text>
    <text x="12" y="${H/2}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Inter,sans-serif" transform="rotate(-90 12 ${H/2})">Momentum →</text>${dots}</svg>`;
}

async function brief(sym){
  const [fo, eq, bo] = await Promise.all(["setups.json","equity.json","breakout.json"].map(f => getJSON(f).catch(() => ({}))));
  const inLabels = res => Object.values(res.old_labels || {}).some(xs => xs.includes(sym));
  const isFo = inLabels(fo), home = isFo ? fo : eq;
  const rows = ["rows","overspill","ranges"].flatMap(k => (home[k] || []).filter(r => r.symbol === sym))
    .concat(isFo ? [] : ["broke","setting"].flatMap(k => (bo[k] || []).filter(r => r.symbol === sym)));
  const rank = {Ready:0, Triggered:1, Watch:2};
  rows.sort((a,b) => (rank[a.stage] ?? 9) - (rank[b.stage] ?? 9));
  let vk = null;
  for(const [lab, xs] of Object.entries(fo.vk_labels || {})){ const x = xs.find(x => x.symbol === sym); if(x){ vk = {...x, final: lab}; break; } }
  const other = Object.entries(home.others || {}).find(([, xs]) => xs.includes(sym));
  const close = (rows.find(r => r.close) || vk || {}).close || (S().closes || {})[sym];
  return {market: isFo ? "F&O" : inLabels(eq) ? "Equity" : "", rows, vk, other: other ? other[0] : null, close,
          old: Object.entries(home.old_labels || {}).find(([, xs]) => xs.includes(sym))?.[0], best: rows.length ? (rank[rows[0].stage] ?? 9) : 9};
}

function intraChart(x, big){

  const lv = [x.orh, x.orl, x.pc].filter(v => v != null);

    <rect x="0" y="${Y(x.orh)}" width="${6 * bw}" height="${Math.max(1, Y(x.orl) - Y(x.orh))}" fill="var(--accent)" opacity=".12"/>`;
  if(x.pc != null && x.pc <= hi && x.pc >= lo) g += `<line x1="0" x2="${W}" y1="${Y(x.pc)}" y2="${Y(x.pc)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/><text x="2" y="${Y(x.pc) - 3}" font-size="8.5" fill="var(--muted)">prev close</text>`;
  const vmax = Math.max(1, ...(b.v || [0]));
  b.c.forEach((c, k) => {
    const i = b.i[k], o = b.o[k], h = b.h[k], l = b.l[k]; if(c == null || o == null) return;
    const up = c >= o, col = up ? "var(--up)" : "var(--down)", cx = X(i);
    g += `<line x1="${cx}" x2="${cx}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="1"/><rect x="${cx - bw * .35}" y="${Y(Math.max(o, c))}" width="${bw * .7}" height="${Math.max(1, Math.abs(Y(o) - Y(c)))}" fill="${col}"/>`;
    if(VH && b.v[k]) g += `<rect x="${cx - bw * .35}" y="${H - 12 - b.v[k] / vmax * VH}" width="${bw * .7}" height="${b.v[k] / vmax * VH}" fill="${col}" opacity=".35"/>`;
  });
  if(b.vw) g += `<polyline points="${b.vw.map((v, k) => v == null ? "" : `${X(b.i[k]).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ")}" fill="none" stroke="var(--accent2)" stroke-width="1.6"/>`;
  const last = b.c[b.c.length - 1], ly = Math.min(H - PB - 2, Math.max(PT + 8, Y(last)));
  g += `<line x1="${X(b.i[b.i.length - 1])}" x2="${W}" y1="${Y(last)}" y2="${Y(last)}" stroke="var(--ink)" stroke-width=".8" opacity=".5"/>`;
  const tl = [[0, "9:15"], [33, "12:00"], [N - 1, "3:30"]].map(([i, t]) => `<text x="${X(i)}" y="${H - 2}" font-size="8.5" fill="var(--muted)" text-anchor="${i === 0 ? "start" : i === N - 1 ? "end" : "middle"}">${t}</text>`).join("");
  return `<svg class="ichart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.s)} 5-minute chart today">${g}${tl}
    <rect x="${W - 54}" y="${ly - 8}" width="52" height="15" rx="4" fill="var(--ink)"/><text x="${W - 28}" y="${ly + 3}" font-size="9.5" fill="var(--bg)" text-anchor="middle" font-family="JetBrains Mono,monospace">${fmt(last)}</text></svg>
    <div class="ilegend"><span><i style="background:var(--accent2)"></i>VWAP</span><span><i style="background:var(--accent);opacity:.35"></i>30-min range</span><span><i style="border-top:1px dashed var(--muted);height:0"></i>Prev close</span></div>`;
}

      ${(L ? past.btst : past.stbt).map(p => { const now = (d.prices || {})[p.s], ch = now && p.c ? (now / p.c - 1) * 100 * (L ? 1 : -1) : null;
        return `<div class="mv"><span>${symLink(p.s, 14)} <span class="muted">at ${fmt(p.c)} · score ${p.score}</span></span><b class="${cls(ch)}">${ch == null ? "—" : pct(ch, 2)}</b></div>`; }).join("") || `<div class="muted">None that day.</div>`}
      <div class="muted" style="font-size:11.5px;margin-top:6px">${L ? "Gain" : "Gain on the short"} from that day's close to the latest price.</div></section>` : "";
    body = `<div class="muted" style="font-size:12.5px;margin-bottom:10px">${d.final ? "Final list for today (after 3:10 pm)." : "Early read. The list firms up after 3 pm; the final one is saved at 3:10 pm."} Stocks with results due are left out.</div>
      <div class="cards">${list.map(x => intraCard(x, L ? "BL" : "BS", chains)).join("") || `<div class="empty">Nothing scores 5 or more yet.</div>`}</div>${review}`;
  }
  if(tab === "oi") body = `<div class="muted" style="font-size:12.5px;margin-bottom:10px">Today's change in total F&amp;O open interest per stock (NSE, ${esc(d.oi_time || "")}) against today's price move.</div>
    <div class="cards">${Object.keys(IQ).map(k => `<section class="card"><div class="ct"><h2 style="color:${IQ[k][1]}">${IQ[k][0]}<em>${(d.board[k] || []).length}</em></h2></div>
      ${(d.board[k] || []).map(r => `<div class="mv"><span>${symLink(r.s, 14)} <span class="muted" style="font-size:11.5px">${esc(r.sec || "")}</span></span><span class="num"><span class="muted">OI ${pct(r.oi)}</span> <b class="${cls(r.chg)}">${pct(r.chg, 2)}</b></span></div>`).join("") || `<div class="muted">None</div>`}</section>`).join("")}</div>`;
  if(tab === "chain"){
    const keys = Object.keys(chains), pick = keys.includes(UI.ich) ? UI.ich : keys[0];
    body = keys.length ? `<div class="filters">${keys.map(k => `<button data-ich="${esc(k)}" class="${k === pick ? "on" : ""}">${esc(k)}</button>`).join("")}</div>${intraChainTable(chains[pick])}` : `<div class="empty">No option chains this run.</div>`;
  }
  const b = d.breadth || {};
  return pageHead("Intraday & BTST", `${live ? "Today" : "Last session " + esc(d.session)} · scan ${esc(d.at)} IST · candles a few minutes late · refreshes every 2 min`) +
    (live ? "" : `<div class="empty" style="margin-bottom:12px;text-align:left">Market closed: showing the last session. The scan restarts at 9:15 am on the next trading day.</div>`) +
    `<div class="kv" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:14px">
      <div><small>F&amp;O up / down</small><b><span class="up">${b.up ?? "—"}</span> / <span class="down">${b.down ?? "—"}</span></b></div>
      <div><small>Above VWAP</small><b>${b.above_vwap ?? "—"} of ${b.n ?? "—"}</b></div>
      <div><small>Nifty</small><b class="${cls((d.index.NIFTY || {}).chg)}">${pct((d.index.NIFTY || {}).chg, 2)}</b></div>
      <div><small>Bank Nifty</small><b class="${cls((d.index.BANKNIFTY || {}).chg)}">${pct((d.index.BANKNIFTY || {}).chg, 2)}</b></div></div>
    <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));margin-bottom:16px">${intraIndex("NIFTY", d.index.NIFTY, chains.NIFTY)}${intraIndex("BANKNIFTY", d.index.BANKNIFTY, chains.BANKNIFTY)}</div>
    <nav class="subnav">${tabs.map(([k, t]) => `<button data-itab="${k}" class="${tab === k ? "on" : ""}">${t}</button>`).join("")}</nav>${body}`;
}


/* ============================================================ FII footprint */
async function pageFII(){
  const f = await getJSON("fii.json").catch(() => null);
  if(!f) return pageHead("FII footprint", "") + subnav() + `<div class="empty">The FII footprint appears after this evening's scan (7 pm).</div>`;
  const pt = f.participant, rows = (pt && pt.rows) || [], last = rows[rows.length - 1];
  const dshort = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", {day:"numeric", month:"short"});
  const big = (lab, v, sub, c) => `<div><small>${lab}</small><b style="font-size:22px${c ? ";color:" + c : ""}">${v}</b><span class="muted" style="display:block;font-size:11.5px">${sub}</span></div>`;
  const part = last ? `<section class="card fade"><div class="ct"><h2>FII positions in F&amp;O<em>NSE participant-wise OI · ${esc(dshort(last.date))}</em></h2></div>
      <div class="kv" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        ${big("Stock futures long", last.sf.long_pct + "%", `net ${last.sf.net >= 0 ? "+" : ""}${fmt(last.sf.net, 0)} contracts`, last.sf.long_pct >= 55 ? "var(--up)" : last.sf.long_pct <= 45 ? "var(--down)" : "")}
        ${big("Index futures long", last.if.long_pct + "%", `net ${last.if.net >= 0 ? "+" : ""}${fmt(last.if.net, 0)} contracts`, last.if.long_pct >= 55 ? "var(--up)" : last.if.long_pct <= 45 ? "var(--down)" : "")}
        ${big("Index calls", `${fmt(last.calls.long - last.calls.short, 0)}`, "net long (bought − sold)")}
        ${big("Index puts", `${fmt(last.puts.long - last.puts.short, 0)}`, "net long (bought − sold)")}</div>
      ${rows.length > 3 ? `<div class="two" style="margin-top:12px"><div><div class="sub-h">Stock futures long %, last ${rows.length} sessions</div><div style="height:50px;overflow:hidden;position:relative;margin-bottom:8px">${spark(rows.map(r => r.sf.long_pct), {h:50, color:"var(--accent2)"})}</div></div>
        <div><div class="sub-h">Index futures long %</div><div style="height:50px;overflow:hidden;position:relative;margin-bottom:8px">${spark(rows.map(r => r.if.long_pct), {h:50, color:"var(--info)"})}</div></div></div>` : ""}
      <div class="checks" style="margin-top:10px">${(pt.read || []).map(r => `<div>${esc(r)}</div>`).join("")}</div>
      <div class="tw" style="margin-top:10px"><table class="t"><tr><th>Date</th><th class="n">Stock fut long %</th><th class="n">Stock fut net</th><th class="n">Index fut long %</th><th class="n">Index fut net</th></tr>
      ${rows.slice().reverse().slice(0, 10).map(r => `<tr><td>${esc(dshort(r.date))}</td><td class="n">${r.sf.long_pct}%</td><td class="n ${cls(r.sf.net)}">${fmt(r.sf.net, 0)}</td><td class="n">${r.if.long_pct}%</td><td class="n ${cls(r.if.net)}">${fmt(r.if.net, 0)}</td></tr>`).join("")}</table></div>
      <div class="muted" style="font-size:11.5px;margin-top:6px">This is all FII positions together, not stock by stock. NSE does not publish FII buying per stock.</div></section>`
    : `<section class="card fade"><div class="empty">FII positions from NSE will appear after the evening scan.</div></section>`;
  const deals = f.deals || [];
  const dealsCard = `<section class="card fade" style="margin-top:14px"><div class="ct"><h2>FII bulk and block deals<em>F&amp;O stocks · last 30 days</em></h2></div>
    ${deals.length ? deals.map(x => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px">${symLink(x.symbol, 14)}<b class="num ${cls(x.net_cr)}">net ₹${fmt(x.net_cr, 1)} Cr</b></div>
      ${x.deals.map(dd => `<div class="muted" style="font-size:12px">${esc(dshort(dd.date))} · ${chip(dd.side === "BUY" ? "Buy" : "Sell", dd.side === "BUY" ? "var(--up)" : "var(--down)")} ${esc(dd.who)} · ₹${fmt(dd.value_cr, 1)} Cr at ${fmt(dd.price)}</div>`).join("")}</div>`).join("")
      : `<div class="muted" style="font-size:12.5px">No foreign institution bulk or block deals in F&amp;O stocks in the last 30 days. Big FIIs rarely buy F&amp;O stocks through bulk deals; their buying mostly shows in futures OI (below) and in quarterly holdings.</div>`}</section>`;
  const tab = UI.fiiTab || "acc", list = tab === "acc" ? (f.accumulation || []) : (f.distribution || []);
  const card = x => `<article class="sc" style="--stc:${tab === "acc" ? "var(--up)" : "var(--down)"}">
    <div class="row1"><div class="symrow">${symLink(x.symbol)}${starBtn(x.symbol)}${liveTag(x.symbol)}</div><span class="grade" title="Score">${x.score}</span></div>
    <div class="chips">${wallChips(x.symbol)}${x.sector ? chip(x.sector) : ""}</div>
    <div class="kv" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><small>Fut OI 5d</small><b class="num" style="font-size:14px">${pct(x.oi5)}</b></div><div><small>Price 5d</small><b class="num ${cls(x.px5)}" style="font-size:14px">${pct(x.px5)}</b></div><div><small>Delivery</small><b class="num" style="font-size:14px">${x.deliv5 != null ? x.deliv5 + "%" : "—"}</b></div></div>
    <div class="checks">${x.why.map(w => `<div>${esc(w)}</div>`).join("")}</div></article>`;
  return pageHead("FII footprint", `What foreign institutions are doing in F&O, from NSE data · updated ${esc(when(f.generated_ist))}`) + subnav() + part + dealsCard +
    `<div class="sec-h"><h2>Institution-style buying, stock by stock</h2><span>estimate · OI data ${esc(f.oi_asof || "")}</span></div>
     <div class="lead" style="margin-bottom:10px">Futures open interest building with price over 5 sessions, delivery above its usual level and higher turnover: how big buyers usually leave tracks. This is an estimate, not confirmed FII buying.</div>
     <div class="filters"><button data-fii="acc" class="${tab === "acc" ? "on" : ""}">Buying · ${(f.accumulation || []).length}</button><button data-fii="dist" class="${tab === "dist" ? "on" : ""}">Selling · ${(f.distribution || []).length}</button></div>
     <div class="cards">${list.map(card).join("") || `<div class="empty">Nothing stands out right now.</div>`}</div>`;
}
