const VIEWS = {today:pageDashboard, "today-strategies":pageStrategies, "today-alist":pageAList, scanner:pageScanner, "scanner-equity":pageScanner,
  index:pageIndex, "index-bank":pageIndex, "index-fin":pageIndex, "index-midcap":pageIndex, "index-next50":pageIndex,
  "today-scorecard":pageScorecard, "admin-scorecard":pageScorecard, search:pageSearch, watchlist:pageWatchlist, market:pageSectors, "market-strongest":pageStrongest, "market-unusual":pageUnusual,
  "market-deals":pageDeals, "market-stars":pageStars, "market-fii":pageFII, "scanner-mtf":pageMTF, "admin-holdings":pageHoldings, "admin-alerts":pageAlerts, lab:pageLab, "lab-rs":pageLab, "lab-iv":pageLab, "lab-expiry":pageLab, admin:pageAdmin, intraday:pageIntraday};
let RENDER_ID = 0, LAST_TRACK = "";
function track(p){       // tells the admin page which pages people open (not counted for the admin)
  if(!USER || isAdmin() || p === LAST_TRACK) return; LAST_TRACK = p;
  try{ navigator.sendBeacon("/api/hit", new Blob([JSON.stringify({p})], {type:"text/plain"})); }catch(e){}
}
setInterval(() => { if(USER && !isAdmin() && document.visibilityState === "visible") fetch("/api/hit", {method:"POST", body:"{}", keepalive:true}).catch(() => {}); }, 120000);
async function render(){
  renderShell();
  const main = document.getElementById("main"), id = ++RENDER_ID, r = route();
  if(!S()){ main.innerHTML = `<div class="soon"><h1>Loading…</h1><p>Fetching the latest scan.</p></div>`; return; }
  const adminOnly = r === "watchlist" || r === "admin" || r === "admin-alerts";
  const proOnly = r === "intraday" || r.startsWith("admin-") || r.endsWith("scorecard");   // admin, or everyone while features are opened
  const fn = adminOnly && !isAdmin() ? (r === "admin" && PRO() ? pageHoldings : pageDashboard)
    : proOnly && !PRO() ? pageDashboard : (VIEWS[r] || pageDashboard);
  let html;
  const need = (NEEDS[r] || []).filter(f => !CACHE[f]);
  const sk = need.length && !render.keepScroll ? setTimeout(() => { if(id === RENDER_ID) main.innerHTML = skeleton(); }, 120) : null;
  try{ html = await fn(); }
  catch(e){ html = pageHead("Could not load", "") + subnav() + `<div class="empty">This page's data could not be loaded (${esc(e.message)}). Check your connection and tap Refresh.</div>`; }
  if(sk) clearTimeout(sk);
  if(id !== RENDER_ID) return;
  const y = scrollY, keep = render.keepScroll;
  const paint = () => {
    main.innerHTML = html + `<p class="foot-note">For study and tracking only. Not investment advice.</p>`;
    if(keep){ scrollTo(0, y); render.keepScroll = false; } else countUps(main);
  };
  if(!keep && document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(paint); else paint();
  if(r === "today") prefetch();
  if(!keep) track(r);
}
const rerender = () => { render.keepScroll = true; render(); };
async function fullChange(body){
  try{ const r = await fetch("/api/admin/full", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body)});
    const j = await r.json(); if(j.error){ toast(j.error); return; }
    toast(body.remove ? `${body.email} removed` : `Full access given to ${String(body.email).trim().toLowerCase()}`); rerender();
  }catch(e){ toast("Could not reach the server."); }
}

document.addEventListener("click", e => {
  const oa = e.target.closest("[data-openall]");
  if(oa){ fetch("/api/admin/open", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({on: oa.dataset.openall === "1"})})
    .then(r => r.json()).then(j => { USER.open = !!j.on; toast(j.on ? "All features are open to everyone" : "Back to the normal member view"); rerender(); }).catch(() => toast("Could not reach the server.")); return; }
  const fr = e.target.closest("[data-fullrm]");
  if(fr){ fullChange({email: fr.dataset.fullrm, remove: true}); return; }
  const sc = e.target.closest("[data-sharecard]");
  if(sc){ e.stopPropagation(); shareCard(sc.dataset.sharecard); return; }
  const fc = e.target.closest("[data-flip]");
  if(fc && !e.target.closest("a, button.star")){ fc.classList.toggle("flip"); return; }
  const b = e.target.closest("button, a[data-go], a[data-setup]"); if(!b) return;
  const d = b.dataset;
  if(d.act === "theme") return flip();
  if(d.act === "refresh") return refreshAll();
  if(d.act === "scan") return isAdmin() && scanAll();
  if(d.star){ e.preventDefault(); return toggleStar(d.star); }
  if(d.strong){ UI.strong = d.strong; return rerender(); }
  if(d.trm){ UI.trMarket = d.trm; return rerender(); }
  if(d.itab){ UI.itab = d.itab; return rerender(); }
  if(d.clear){ UI.clear = !UI.clear; return rerender(); }
  if(d.mtf){ const [k, v] = d.mtf.split(":"); UI.mtf = {...(UI.mtf || {M:"All",W:"All",D:"All"}), [k]: v}; return rerender(); }
  if(d.adel){ if(ALR) alrSaveItems((ALR.items || []).filter(i => i.s !== d.adel)); return; }
  if(d.aon){ alrCall({on: d.aon === "1"}).then(() => rerender()); return; }
  if(d.atest){ toast("Sending test…"); alrCall({test: true}).then(r => { toast(`Email: ${r.mail || r.error} · Telegram: ${r.tg || "—"}`); alrCall().then(() => rerender()); }); return; }
  if(d.hdel){ if(HOLD) holdSave((HOLD.items || []).filter(i => i.s !== d.hdel)); return; }
  if(d.hadd){ holdAdd({s: d.hadd}); return; }
  if(d.mtfgood){ UI.mtfGood = !UI.mtfGood; return rerender(); }
  if(d.mtfp){ const v = d.mtfp.split("|"); UI.mtf = {M:v[0], W:v[1], D:v[2]}; return rerender(); }
  if(d.fii){ UI.fiiTab = d.fii; return rerender(); }
  if(d.ich){ UI.ich = d.ich; return rerender(); }
  if(d.sm){ UI.strongMarket = d.sm; return rerender(); }
  if(d.more){ UI.more = true; return rerender(); }
  if(d.setup != null && b.tagName === "A"){ UI.setup.fo = d.setup; return; }
  if(d.setup != null){ const k = route() === "scanner-equity" ? "eq" : "fo"; UI.setup[k] = d.setup; if(d.setup === "Patterns") UI.pat = "All"; return rerender(); }
  if(d.pat){ UI.pat = d.pat; return rerender(); }
  if(d.spill){ UI.spill = d.spill; return rerender(); }
  if(d.stage){ const [k, g] = d.stage.split(":"); UI.stage[k] = g; return rerender(); }
  if(d.vk){ UI.vk = d.vk; return rerender(); }
  if(d.lean){ UI.lean = d.lean; return rerender(); }
  if(d.um){ UI.umarket = d.um; UI.lean = "All"; return rerender(); }
  if(d.ds){ UI.dealSide = d.ds; return rerender(); }
  if(d.starInv){ UI.star = d.starInv; return rerender(); }
  if(d.go){ UI.search = d.go; if(route() === "search") rerender(); return; }
  if(d.unwatch){ return watchChange({remove:[d.unwatch]}, `${d.unwatch} removed from your watchlist`); }
  if(d.note){ const t = document.getElementById("note-" + d.note); return watchChange({note:{[d.note]: t ? t.value : ""}}, `Note saved for ${d.note}`); }
});
document.addEventListener("keydown", e => { if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-flip]")){ e.preventDefault(); e.target.classList.toggle("flip"); } });
document.addEventListener("submit", e => {

(async function boot(){
  const siteP = getJSON("site.json").catch(e => e);   // start the data download at once, alongside the sign-in check
  try{
    const r = await fetch("/api/me", {cache:"no-store"});
    if(r.status === 401){ location.href = "/login"; return; }
    if(r.ok) USER = await r.json();
  }catch(e){ USER = null; }          // no server (preview): show everything
  if(USER && USER.role === "admin") fetch("/api/kite/status", {cache:"no-store"}).then(r => r.ok ? r.json() : null)
    .then(k => { if(k){ KITE = k; renderShell(); if(route() === "today") rerender(); } }).catch(() => null);   // not waited on
  { const q = new URLSearchParams(location.search).get("kite");
    if(q){ setTimeout(() => toast(q === "ok" ? "Kite connected for today ✓" : q === "failed" ? "Kite login did not finish. Try again." : "Kite login cancelled"), 600);
           history.replaceState(null, "", location.pathname + location.hash); } }
  renderShell();
  try{ const sj = await siteP; if(sj instanceof Error) throw sj; await Promise.all([loadLive(), loadWatch()]); applyLive(); }
  catch(e){
    document.getElementById("main").innerHTML = `<div class="soon"><h1>No dashboard data yet</h1><p>The dashboard file is made by the Setups scan. Run that scan once on GitHub (Actions → Setups scan → Run workflow), then reload this page.</p></div>`;
    return;
  }
  getJSON("sectors.json").catch(() => null);
  render();
  setInterval(async () => { try{ await getJSON("site.json", true); await loadWatch(); if(route() === "today") rerender(); }catch(e){} }, 5*60*1000);
  setInterval(async () => { if(document.visibilityState !== "visible") return; await loadLive(); if(route() === "today" || route().startsWith("market")) rerender(); }, 2*60*1000);
  if(isAdmin()) pollScans();
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});
  installHint();
})();
function installHint(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  let seen = false; try{ seen = localStorage.getItem("tr-install") === "1"; }catch(e){}
  if(standalone || !ios || seen) return;
  const b = document.createElement("div"); b.className = "installhint";
  b.innerHTML = `<span class="brand"><span class="mark" style="width:34px;height:34px">${document.querySelector(".brand .mark") ? document.querySelector(".brand .mark").innerHTML : ""}</span></span>
    <div style="flex:1;min-width:0"><b>Get the TradeReady app</b><div>In Safari tap <b>≡</b> next to the address (or <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/></svg>), then <b>Share → Add to Home Screen</b>.</div></div>
    <button aria-label="Close">✕</button>`;
  b.querySelector("button").onclick = () => { b.remove(); try{ localStorage.setItem("tr-install", "1"); }catch(e){} };
  document.body.appendChild(b);
}
