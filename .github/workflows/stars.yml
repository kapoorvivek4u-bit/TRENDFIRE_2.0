name: Star investors

# Reads NSE shareholding filings. The first fill takes about a day of these runs; after
# that each run only picks up new filings.
on:
  schedule:
    - cron: "20 */3 * * *"      # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stars-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install pandas numpy requests

      - name: Read shareholding filings
        run: python stars_scan.py

      - name: Save results to the repo
        run: |
          git config user.name "setups-bot"
          git config user.email "setups-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Star investors $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep 7
          done
          exit 1
