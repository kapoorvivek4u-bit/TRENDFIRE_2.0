name: Sector radar

# Scores each sector for the next 1-5 days and checks earlier calls (sector_radar.py).
# Started by the site (worker.js runSchedule) at 17:00 and 20:45 IST on weekdays.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: setups-scan
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Score sectors
        run: python sector_radar.py
      - name: Save results to the repo
        run: |
          git config user.name "setups-bot"
          git config user.email "setups-bot@users.noreply.github.com"
          git add data/radar.json data/radar_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "Sector radar $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null
            sleep $((i * 6))
          done
          exit 1
