name: Deals scan

on:
  # Started by the site (worker.js runSchedule) on a fixed timetable; GitHub cron ran hours late.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deals-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install pandas numpy requests

      - name: Run deals scan
        run: python deals_scan.py

      - name: FII footprint
        run: python fii_scan.py || echo "FII footprint failed; deals are still saved"

      - name: Save results to the repo
        run: |
          git config user.name "setups-bot"
          git config user.email "setups-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Deals scan $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep 7
          done
          exit 1
