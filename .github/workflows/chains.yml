name: Option screener

on:
  # Started by the site (worker.js runSchedule): hourly in market hours and once after the close.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: option-screener
  cancel-in-progress: false

jobs:
  chains:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy yfinance
      - name: Read every F&O option chain
        env:
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: python chains_all.py
      - name: Save results to the repo
        run: |
          git config user.name "setups-bot"
          git config user.email "setups-bot@users.noreply.github.com"
          git add data/chain_screen.json
          git diff --cached --quiet && exit 0
          git commit -m "Option screener $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null
            sleep $((i * 6))
          done
          exit 1
